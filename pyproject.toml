[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nikias-hoard"
version = "0.1.0"
description = "Colouring studio for multi-material 3D printing: gives a finished print figure a few filament colours from textured models, reference pictures and a vision model, and writes painted 3MF files, with an MCP bridge."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Luissalet" }]
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7", "httpx>=0.27", "mcp>=1.10,<2", "pillow>=10", "numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nikias-hoard = "nikias_hoard.__main__:main"

[tool.setuptools.packages.find]
include = ["nikias_hoard*"]

[tool.setuptools.package-data]
nikias_hoard = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
